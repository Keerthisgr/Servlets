<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 300px;
}

h2 {
    text-align: center;
    color: #333333;
}

.form-group {
    margin-bottom: 15px;
}

.form-group input {
    width: calc(100% - 10px);
    padding: 10px;
    border: 1px solid #cccccc;
    border-radius: 5px;
    box-sizing: border-box;
}

input[type="submit"] {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
}

input[type="submit"]:hover {
    background-color: #45a049;
}

    </style>
</head>
<body>
<form action= "addData" method="post">
    <h2>Login Form</h2>

    <div class="form-group">
        Name
        <input type="text" name="name">
    </div>

    <div class="form-group">
        Father Name
        <input type="text" name="fatherName">
    </div>

    <div class="form-group">
        Mother Name
        <input type="text" name="motherName">
    </div>

    <div class="form-group">
        Mobile Number
        <input type="tel" name="cNo">
    </div>

    <div class="form-group">
        Address
        <input type="text" name="address">
    </div>

    <div class="form-group">
        Qualification
        <input type="text" name="qualification">
    </div>

    <input type="submit" value="Register">
</form>
</body>
</html>
