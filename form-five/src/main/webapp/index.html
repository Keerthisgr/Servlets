<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
<form action= "addDetails" method="post">
    <h2>Login Form</h2>

    <div class="form-group">
        Name
        <input type="text" name="name">
    </div>

    <div class="form-group">
        Father Name
        <input type="text" name="fatherName">
    </div>

    <div class="form-group">
        Date of Birth
        <input type="text" name="dob">
    </div>

    <div class="form-group">
        Mobile Number
        <input type="tel" name="cNo">
    </div>

    <div class="form-group">
        Blood group
        <input type="text" name="bGroup">
    </div>

    <div class="form-group">
        Qualification
        <input type="text" name="qualification">
    </div>

    <input type="submit" value="Register">
</form>
</body>
</html>
