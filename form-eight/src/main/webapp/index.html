<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>register</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f0f8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    width: 350px;
}

h2 {
    text-align: center;
    color: #333333;
}

.form-group {
    margin-bottom: 15px;
}

.form-group input {
    width: calc(100% - 20px);
    padding: 10px;
    border: 1px solid #cccccc;
    border-radius: 5px;
    box-sizing: border-box;
}

input[type="submit"] {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
}

input[type="submit"]:hover {
    background-color: #45a049;
}

    </style>
</head>
<body>
<form action= "addInfo" method="post">
    <h2>Register Here</h2>

    <div class="form-group">
        First Name
        <input type="text" name="firstName">
    </div>

    <div class="form-group">
        Middle Name
        <input type="text" name="middleName">
    </div>

    <div class="form-group">
        Last Name
        <input type="text" name="lastName">
    </div>

    <div class="form-group">
        Mobile number
        <input type="tel" name="cNo">
    </div>

    <div class="form-group">
        Email
        <input type="email" name="email">
    </div>

    <div class="form-group">
        Address
        <input type="text" name="address">
    </div>

    <input type="submit" value="Register">
</form>
</body>
</html>
