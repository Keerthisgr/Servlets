<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background: rgb(236, 189, 173);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }



        input {
            width:90%;
            padding: 10px;
            margin-bottom: 15px;
            margin-right:10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s ease;
            margin-left:10px;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .form-group {
            margin-bottom: 15px;
        }


    </style>
</head>
<body>
<form action= "addProfile" method="post">
    <h2>Login Form</h2>

    <div class="form-group">
        First Name
        <input type="text" name="firstName">
    </div>

    <div class="form-group">
       Last Name
        <input type="text" name="lastName">
    </div>

    <div class="form-group">
       Email
        <input type="email" name="email">
    </div>

    <div class="form-group">
       Mobile number
        <input type="tel" name="cNo">
    </div>

    <div class="form-group">
        Address
        <input type="text" name="address">
    </div>

    <div class="form-group">
        City
        <input type="text" name="city">
    </div>

    <input type="submit" value="Register">
</form>
</body>
</html>
